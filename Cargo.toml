[package]
name = "gh-contrib"
version = "0.6.0"
edition = "2024"
license = "MIT"
description = "Displays GitHub contribution history in the terminal using the gh CLI"
repository = "https://github.com/banyan/gh-contrib"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
