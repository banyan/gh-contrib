name: Release

# Publishes precompiled binaries named the way `gh extension install`
# expects (gh-contrib-<os>-<arch>[.exe]), so the extension runs without any
# toolchain on the user's machine.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin, asset: gh-contrib-darwin-arm64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, asset: gh-contrib-darwin-amd64 }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: gh-contrib-linux-amd64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: gh-contrib-linux-arm64 }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, asset: gh-contrib-windows-amd64.exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - shell: bash
        run: |
          src=target/${{ matrix.target }}/release/gh-contrib
          [[ "${{ matrix.target }}" == *windows* ]] && src="$src.exe"
          mkdir dist && cp "$src" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
